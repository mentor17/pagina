<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verduras y Algo Más – Morón</title>
<meta name="description" content="Verdulería ficticia en Morón: verduras con personalidad, un encargado muy particular y Packs absurdos. Sitio humorístico y satírico.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🥕%3C/text%3E%3C/svg%3E">

<style>
:root{
  --green:#175c36;
  --green2:#2f8f55;
  --cream:#fff9ec;
  --ink:#243228;
  --tomato:#c74232;
  --yellow:#f3c74f;
  --orange:#e58d35;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20px 20px,rgba(111,78,55,.035) 1px,transparent 1px) 0 0/26px 26px,
    var(--cream);
}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{
  outline:3px solid var(--orange);
  outline-offset:5px;
}
.banderines{
  position:absolute;
  inset:0 0 auto;
  display:flex;
  justify-content:center;
  gap:4px;
  height:78px;
  overflow:hidden;
  z-index:4;
  pointer-events:none;
}
.bandera{
  flex:0 0 54px;
  height:66px;
  clip-path:polygon(0 0,100% 0,50% 100%);
}
.bandera:nth-child(4n+1){background:var(--tomato)}
.bandera:nth-child(4n+2){background:var(--yellow)}
.bandera:nth-child(4n+3){background:var(--green2)}
.bandera:nth-child(4n){background:var(--orange)}

.hero{
  min-height:710px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:220px 20px 80px;
  background:
    linear-gradient(120deg,rgba(20,84,48,.94),rgba(46,118,67,.82),rgba(50,35,20,.7)),
    url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1800&q=85");
  background-size:cover;
  background-position:center;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:70px;
  background:linear-gradient(to bottom,transparent,var(--cream));
  pointer-events:none;
}
.hero-inner{position:relative;z-index:3;max-width:980px}
.kicker{
  display:inline-block;
  background:#fff7cc;
  color:#5b4511;
  border:2px solid rgba(255,255,255,.65);
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  padding:11px 18px;
  border-radius:999px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
  transform:rotate(-1.3deg);
}
.hero h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(46px,8vw,88px);
  line-height:1;
  margin:26px 0 14px;
  text-shadow:0 4px 18px rgba(0,0,0,.28);
}
.hero-subtitle{
  margin:0 auto;
  max-width:800px;
  font-size:clamp(20px,3vw,29px);
  line-height:1.35;
  color:#f5ffe9;
}
.satira-aviso{
  max-width:720px;
  margin:18px auto 0;
  color:#fffbe9;
  font-size:14px;
  line-height:1.5;
  font-style:italic;
}
.cartel-verdura{
  display:inline-block;
  margin-top:28px;
  background:white;
  color:var(--green);
  border:4px double var(--green);
  border-radius:10px;
  padding:15px 22px;
  font-weight:900;
  font-size:clamp(18px,2.5vw,28px);
  text-transform:uppercase;
  letter-spacing:1px;
  transform:rotate(1.6deg);
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.hero-buttons{margin-top:30px}
button,.btn{
  display:inline-block;
  border:0;
  padding:14px 22px;
  border-radius:13px;
  font-family:inherit;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  margin:6px;
  text-decoration:none;
  transition:transform .18s ease;
  box-shadow:0 7px 18px rgba(0,0,0,.13);
}
button:hover,.btn:hover{transform:translateY(-2px)}
.primary{background:var(--green);color:white}
.secondary{background:var(--tomato);color:white}
.tertiary{background:var(--yellow);color:#4c3a0b}

.faja-verdura{
  position:absolute;
  top:62px;
  right:24px;
  width:min(430px,calc(100% - 48px));
  padding:16px 28px;
  background:linear-gradient(135deg,#c0392b,#8e261c);
  color:white;
  text-align:center;
  font-size:20px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  transform:rotate(9deg);
  z-index:5;
  border:4px solid rgba(255,255,255,.82);
  border-radius:4px;
  box-shadow:0 9px 22px rgba(0,0,0,.34);
  text-shadow:1px 2px 2px rgba(0,0,0,.42);
}
.faja-sub{
  display:block;
  margin-top:8px;
  font-size:12px;
  letter-spacing:2px;
  color:#ffe9a8;
}
.container{max-width:1120px;margin:auto;padding:20px 18px 50px}
.notice-strip{
  margin:-18px auto 30px;
  position:relative;
  z-index:6;
  max-width:920px;
  background:white;
  border:2px dashed var(--green2);
  border-radius:18px;
  padding:16px 18px;
  text-align:center;
  font-size:18px;
  line-height:1.5;
  font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.card{
  background:rgba(255,255,255,.95);
  border:1px solid #ece3d1;
  border-radius:24px;
  padding:28px;
  margin-bottom:24px;
  box-shadow:0 12px 35px rgba(63,44,24,.08);
}
.card h2{
  margin:0 0 16px;
  color:var(--green);
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
}
.card p{font-size:18px;line-height:1.6}
.center{text-align:center}
.visit{
  display:inline-block;
  background:#26332b;
  color:#c5f4d2;
  padding:10px 18px;
  border-radius:999px;
  font-weight:900;
  margin:6px auto 20px;
}
.random{
  background:linear-gradient(135deg,#fff4d7,#fff);
  border:2px solid #f2d18a;
  text-align:center;
}
.random small{
  color:#914711;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}
#oferta{
  margin:14px 0;
  font-size:28px;
  font-weight:900;
  color:#6b3b15;
  min-height:86px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.precio-nota{display:block;font-size:13px;color:#6b573f}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.item{
  background:white;
  border:1px solid #e7ddc8;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 7px 18px rgba(0,0,0,.045);
}
.item img{width:100%;height:220px;object-fit:cover;display:block}
.item-content{padding:18px}
.item h3{margin:0 0 8px;color:#14532d;font-size:19px}
.item p{margin:0;color:#536057;font-size:16px}
.testimonial,.mini-card{
  background:#fbfaf5;
  border-left:5px solid var(--green2);
  padding:18px;
  border-radius:14px;
  font-size:17px;
  line-height:1.5;
}
.mini-card.yellow{border-left-color:var(--yellow)}
.mini-card.red{border-left-color:var(--tomato)}
.encargado-zone{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:20px;
  align-items:center;
}
.cajon{
  padding:30px 20px;
  border:6px solid #ba8752;
  border-radius:16px;
  color:#563619;
  background:repeating-linear-gradient(0deg,#f5dfb8 0 38px,#e7c493 38px 42px);
  text-align:center;
  font-weight:900;
  transform:rotate(-4deg);
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}
.cajon .verduras{font-size:48px;margin-bottom:16px}
.cajon small{display:block;margin-top:12px}
.timeline{display:grid;gap:12px}
.step{
  padding:15px 16px;
  border-radius:14px;
  background:#f8fbf7;
  border:1px solid #deeadf;
  font-size:17px;
  line-height:1.5;
}
.step strong{color:var(--green)}

.packs-verdura{
  background:linear-gradient(135deg,#fffbeb,#fef3c7);
  border:3px dashed #d97706;
  scroll-margin-top:20px;
}
.packs-verdura h2{color:#92400e}
.packs-intro{color:#78350f}
.cartel-packs{
  margin:25px 0;
  padding:24px;
  background:#7f1d1d;
  color:white;
  border-radius:18px;
  text-align:center;
  font-size:24px;
  font-weight:900;
  line-height:1.35;
  text-transform:uppercase;
}
.pack-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  margin-top:22px;
}
.pack{
  background:white;
  border:1px solid #f59e0b;
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 20px rgba(0,0,0,.07);
}
.pack .emoji{font-size:38px;margin-bottom:10px}
.pack h3{margin:0 0 10px;color:#92400e;font-size:21px}
.pack p{margin:0;font-size:16px;line-height:1.55;color:#4b5563}
.pack .remate{margin-top:16px;color:#78350f;font-weight:800}
.preguntas-packs{margin-top:28px}
.preguntas-packs h3{color:#78350f}
details{
  background:white;
  border-left:5px solid #d97706;
  border-radius:14px;
  padding:16px 18px;
  margin-bottom:12px;
}
summary{cursor:pointer;color:#78350f;font-weight:800;line-height:1.5}
details p{margin:10px 0 0}
.microtexto{text-align:center;font-size:13px!important;font-style:italic;color:#78350f}
.cta{
  text-align:center;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:white;
}
.cta h2{color:white}
.cta p{color:#ebffef}

dialog{
  border:3px solid #ecdfc4;
  border-radius:28px;
  padding:34px;
  width:calc(100% - 40px);
  max-width:590px;
  max-height:85vh;
  overflow:auto;
  background:#fffef9;
  color:var(--ink);
  text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}
dialog::backdrop{background:rgba(0,0,0,.62)}
.modal-icon{font-size:52px;margin-bottom:10px}
.modal-title{font-size:26px;color:var(--green);margin:0 0 16px}
#textoModal{font-size:21px;line-height:1.5;margin:0 0 24px}
.modal-note{
  background:#fff3c8;
  border:1px solid #efd177;
  color:#614e13;
  padding:15px;
  border-radius:15px;
  font-size:14px;
}
footer{text-align:center;padding:30px 20px 42px;color:#6d6251;font-size:14px;line-height:1.6}
.footer-badge{display:inline-block;margin-top:8px;padding:7px 11px;background:#efe6d2;border-radius:14px}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .encargado-zone,.pack-grid{grid-template-columns:1fr}
  .cajon{max-width:320px;width:100%;margin:auto}
}
@media(max-width:650px){
  .faja-verdura{
    top:40px;
    right:20px;
    width:calc(100% - 40px);
    font-size:14px;
    padding:13px 16px;
    transform:rotate(4deg);
  }
  .faja-sub{font-size:10px}
  .hero{min-height:680px;padding:180px 18px 70px}
  .grid,.grid-2{grid-template-columns:1fr}
  #oferta{font-size:22px}
  .card{padding:22px}
  .card h2{font-size:28px}
  .bandera{flex-basis:42px;height:54px}
  .cartel-packs{font-size:19px;padding:18px}
  dialog{padding:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  button,.btn{transition:none}
}
</style>
</head>
